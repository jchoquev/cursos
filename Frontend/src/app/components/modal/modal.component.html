<div
  #backdrop
  *ngIf="rendered()"
  class="app-modal-backdrop fixed inset-0 z-[100] flex h-screen w-screen items-center justify-center bg-black/60 p-4 backdrop-blur-sm transition-opacity duration-200"
  [class.opacity-0]="closing()"
  [class.opacity-100]="!closing()"
  (click)="onBackdropClick($event)"
>
  <section
    #dialog
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    class="app-modal-dialog flex w-full min-h-0 max-h-[calc(100dvh-2rem)] flex-col overflow-hidden rounded-2xl shadow-2xl transition duration-200 ease-out"
    [ngClass]="[maxWidth(), panelClass()]"
    [class.opacity-0]="closing()"
    [class.scale-95]="closing()"
    [class.opacity-100]="!closing()"
    [class.scale-100]="!closing()"
    [attr.aria-labelledby]="title() ? labelledBy() : null"
    [attr.aria-describedby]="description() ? describedBy() : null"
    (click)="$event.stopPropagation()"
  >
    <header *ngIf="showHeader()" class="flex shrink-0 items-start justify-between gap-4 border-b border-slate-200 px-4 py-4 sm:px-6 dark:border-white/10">
      <div class="min-w-0">
        <h2 *ngIf="title()" [id]="labelledBy()" class="modal-title text-base font-bold text-slate-900 sm:text-lg dark:text-white">{{ title() }}</h2>
        <p *ngIf="description()" [id]="describedBy()" class="modal-description mt-1 text-xs text-slate-500 dark:text-slate-400">{{ description() }}</p>
        <ng-content select="[modal-header]"></ng-content>
      </div>
      <button type="button" aria-label="Cerrar modal" (click)="requestClose()" class="modal-close shrink-0 rounded-xl p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-wine-500 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-white">
        <span aria-hidden="true" class="text-lg leading-none">×</span>
      </button>
    </header>

    <main class="min-h-0 flex-1 overflow-y-auto px-4 py-5 sm:px-6">
      <ng-content></ng-content>
    </main>

    <footer *ngIf="showFooter()" class="shrink-0 border-t border-slate-200 px-4 py-4 sm:px-6 dark:border-white/10">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>
  </section>
</div>
