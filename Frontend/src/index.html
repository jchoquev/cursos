<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cursos e Investigación</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo-chojata.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    (() => {
      // El modo claro queda reservado para una futura reactivación.
      // Aplicar oscuro antes de Angular evita cualquier flash claro durante
      // la carga inicial o la hidratación SSR.
      document.documentElement.classList.remove('light-mode');
      document.documentElement.classList.add('dark-mode');
      document.body.classList.remove('light-mode');
      document.body.classList.add('dark-mode');
      document.documentElement.style.colorScheme = 'dark';
    })();
  </script>
  <app-root></app-root>
</body>
</html>
